<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Page not found — MockPixel</title>
    <meta name="robots" content="noindex" />
    <meta name="description" content="The page you’re looking for doesn’t exist." />
    <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>

    <header class="nav" id="nav">
      <div class="container nav__inner">
        <a class="logo" href="index.html" aria-label="MockPixel home">
          <span class="logo__mark" aria-hidden="true">M</span>
          <span>MockPixel</span>
        </a>
        <nav class="nav__links" aria-label="Primary">
          <a href="index.html#features">Features</a>
          <a href="privacy.html">Privacy</a>
          <a href="terms.html">Terms</a>
          <a href="index.html#contact">Contact</a>
        </nav>
        <div class="nav__actions">
          <a class="btn btn--outline" href="index.html#download">Download App</a>
          <button class="nav__toggle" type="button" aria-expanded="false" aria-label="Open menu" data-nav-toggle>
            <span></span>
          </button>
        </div>
      </div>
    </header>

    <main id="main" class="notfound">
      <div>
        <h1>404</h1>
        <h2>Page not found</h2>
        <p>The page you’re looking for doesn’t exist or has been moved.</p>
        <a class="btn btn--primary" href="index.html">Go home</a>
      </div>
    </main>

    <footer class="footer">
      <div class="container">
        <div class="footer__top">
          <a class="logo" href="index.html">
            <span class="logo__mark" aria-hidden="true">M</span>
            <span>MockPixel</span>
          </a>
          <nav class="footer__links" aria-label="Footer">
            <a href="index.html#features">Features</a>
            <a href="privacy.html">Privacy Policy</a>
            <a href="terms.html">Terms</a>
            <a href="index.html#contact">Contact</a>
          </nav>
        </div>
        <div class="footer__bottom">
          <span>Version 0.0.1</span>
          <span>© 2026 MockPixel. All rights reserved.</span>
        </div>
      </div>
    </footer>

    <script>
      (function () {
        var nav = document.getElementById("nav");
        var toggle = document.querySelector("[data-nav-toggle]");
        if (!nav || !toggle) return;
        toggle.addEventListener("click", function () {
          var open = nav.classList.toggle("is-open");
          toggle.setAttribute("aria-expanded", open ? "true" : "false");
          toggle.setAttribute("aria-label", open ? "Close menu" : "Open menu");
        });
      })();
    </script>
  </body>
</html>
